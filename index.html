<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>变脸大师 · 川剧变脸</title>
<style>
:root{
  --gold:#e8c46a;
  --gold-2:#f7e3ac;
  --red:#c0392b;
  --paper:#f2e6cf;
  --ink:#0a0404;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;}
body{
  background:radial-gradient(120% 90% at 50% 8%, #4a160c 0%, #240906 38%, #0a0404 100%);
  color:var(--paper);
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,"SimSun",serif;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.55;z-index:1;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:3px 3px;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;}

.game{
  position:relative;z-index:2;
  width:min(100vw,460px);height:100vh;margin:0 auto;
  padding:14px 20px 20px;
  display:flex;flex-direction:column;
}
@supports (height:100dvh){.game{height:100dvh;}}

/* ---------- HUD ---------- */
.hud{
  display:flex;gap:8px;justify-content:space-between;align-items:center;
  padding:9px 14px;border:1px solid rgba(232,196,106,.18);border-radius:12px;
  background:linear-gradient(180deg,rgba(232,196,106,.07),rgba(232,196,106,.015));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.hud-item{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;overflow:hidden;}
.hud-label{font-size:10px;letter-spacing:.3em;text-indent:.3em;color:rgba(232,196,106,.5);white-space:nowrap;}
.hud b{font-size:20px;line-height:1.15;color:var(--gold-2);font-weight:700;font-variant-numeric:tabular-nums;}
.hud b.bump{animation:bump .25s ease-out;}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.28);color:#fff}100%{transform:scale(1)}}
#lives{font-size:12px;letter-spacing:.14em;line-height:1.5;}
#lives i{font-style:normal;color:rgba(232,196,106,.14);transition:color .2s,text-shadow .2s;}
#lives i.on{color:var(--gold);text-shadow:0 0 9px rgba(232,196,106,.75);}

/* ---------- 戏令 ---------- */
.cmd{margin-top:16px;text-align:center;}
.cmd-label{font-size:10px;letter-spacing:.65em;text-indent:.65em;color:rgba(232,196,106,.45);}
.cmd-main{
  margin-top:5px;display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:clamp(26px,7.6vw,38px);font-weight:800;letter-spacing:.1em;
  transition:color .18s;
}
.cmd-dot{
  width:16px;height:16px;border-radius:50%;flex:none;
  box-shadow:0 0 18px 2px currentColor, inset 0 0 0 2px rgba(255,255,255,.55);
  background:currentColor;
}
.cmd-main.pop{animation:cmdPop .3s ease-out;}
@keyframes cmdPop{0%{transform:scale(.86);opacity:.4}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

/* ---------- 脸谱 ---------- */
.stage-face{
  flex:1;min-height:0;position:relative;
  display:flex;align-items:center;justify-content:center;
  margin:4px 0 2px;
}
.stage-face::before{
  content:'';position:absolute;width:min(72vw,280px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(232,196,106,.18) 0%,rgba(192,57,43,.12) 42%,transparent 68%);
  filter:blur(8px);
}
.ring{
  position:absolute;width:min(76vw,300px);aspect-ratio:1;border-radius:50%;
  border:1px dashed rgba(232,196,106,.26);
  animation:spin 30s linear infinite;
}
.ring::after{
  content:'';position:absolute;inset:11px;border-radius:50%;
  border:1px solid rgba(232,196,106,.1);
}
.ring::before{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border-top:2px solid rgba(232,196,106,.5);
  border-left:2px solid transparent;border-right:2px solid transparent;border-bottom:2px solid transparent;
  animation:spin 6s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}

.face{
  position:relative;z-index:2;
  width:min(58vw,228px);aspect-ratio:5/6;
}
.face svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.65));}
.face.pop{animation:facePop .24s cubic-bezier(.34,1.4,.5,1);}
@keyframes facePop{
  0%{transform:scale(.84) rotate(-4deg);filter:blur(2.5px);opacity:.3}
  55%{transform:scale(1.05) rotate(1.5deg);filter:blur(0)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.face.hit{animation:faceHit .3s ease-out;}
@keyframes faceHit{
  0%{transform:scale(1)}
  35%{transform:scale(1.12);filter:brightness(1.5) drop-shadow(0 0 24px rgba(232,196,106,.9))}
  100%{transform:scale(1);filter:none}
}

/* ---------- 浮动分 ---------- */
.float{
  position:fixed;z-index:7;pointer-events:none;font-weight:800;font-size:26px;
  color:var(--gold-2);opacity:0;text-shadow:0 0 18px rgba(232,196,106,.9);
  transform:translate(-50%,-50%);
}
.float.go{animation:floatUp .9s ease-out forwards;}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-56%) scale(1.18)}
  100%{opacity:0;transform:translate(-50%,-135%) scale(1)}
}

/* ---------- 按钮 ---------- */
.btn-liang{
  position:relative;margin-top:10px;width:100%;height:74px;
  border:1px solid rgba(232,196,106,.42);border-radius:14px;
  background:linear-gradient(180deg,rgba(232,196,106,.15),rgba(192,57,43,.2));
  color:var(--gold-2);font-family:inherit;font-size:25px;font-weight:800;
  letter-spacing:.44em;text-indent:.44em;cursor:pointer;
  transition:transform .07s ease, box-shadow .25s ease, opacity .2s;
  box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
.btn-liang small{
  display:block;font-size:10px;letter-spacing:.18em;text-indent:.18em;
  color:rgba(232,196,106,.48);font-weight:400;margin-top:3px;
}
.btn-liang:active{transform:scale(.975);box-shadow:0 0 30px rgba(232,196,106,.4);}
.btn-liang:disabled{opacity:.3;cursor:default;}

/* ---------- 遮罩 ---------- */
.overlay{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 28px;text-align:center;
  background:rgba(6,2,2,.84);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .32s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}

.title{
  font-size:clamp(38px,11vw,52px);font-weight:900;letter-spacing:.14em;text-indent:.14em;
  background:linear-gradient(180deg,#fff4d2 0%,#e8c46a 48%,#b3853a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(232,196,106,.35));
  margin:0;
}
.subtitle{
  margin-top:10px;font-size:12px;letter-spacing:.42em;text-indent:.42em;
  color:rgba(232,196,106,.6);
}
.divider{
  width:120px;height:1px;margin:24px auto;
  background:linear-gradient(90deg,transparent,rgba(232,196,106,.55),transparent);
  position:relative;
}
.divider::after{
  content:'❖';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:rgba(232,196,106,.7);font-size:11px;background:#0d0504;padding:0 6px;
}
.rules{max-width:330px;text-align:left;font-size:13px;line-height:2;color:rgba(242,230,207,.72);}
.rules p{margin:0 0 2px;display:flex;gap:9px;}
.rules p span{color:var(--gold);flex:none;}
.rules em{font-style:normal;color:var(--gold-2);}

.btn-start{
  margin-top:30px;padding:15px 52px;border-radius:40px;border:1px solid rgba(232,196,106,.6);
  background:linear-gradient(180deg,rgba(192,57,43,.55),rgba(120,30,22,.6));
  color:#fff3d4;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:.3em;text-indent:.3em;
  cursor:pointer;box-shadow:0 0 28px rgba(192,57,43,.4), inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .1s, box-shadow .25s;
}
.btn-start:active{transform:scale(.96);box-shadow:0 0 40px rgba(232,196,106,.5);}
.hint{margin-top:16px;font-size:11px;letter-spacing:.2em;color:rgba(242,230,207,.32);}

/* 结算 */
.rank{font-size:clamp(26px,7.6vw,34px);font-weight:900;letter-spacing:.16em;text-indent:.16em;
  background:linear-gradient(180deg,#fff4d2,#e8c46a 55%,#b3853a);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 0;}
.rank-poem{font-size:12px;letter-spacing:.14em;color:rgba(232,196,106,.55);margin-top:10px;}
.score-big{font-size:58px;font-weight:900;color:var(--gold-2);line-height:1.1;margin:6px 0 0;
  text-shadow:0 0 34px rgba(232,196,106,.4);font-variant-numeric:tabular-nums;}
.stats{display:flex;gap:0;margin-top:22px;border-top:1px solid rgba(232,196,106,.16);
  border-bottom:1px solid rgba(232,196,106,.16);padding:14px 0;width:min(100%,330px);}
.stat{flex:1;display:flex;flex-direction:column;gap:4px;}
.stat + .stat{border-left:1px solid rgba(232,196,106,.12);}
.stat span{font-size:10px;letter-spacing:.24em;text-indent:.24em;color:rgba(232,196,106,.45);}
.stat b{font-size:19px;color:var(--paper);font-weight:700;font-variant-numeric:tabular-nums;}
.best-tip{margin-top:16px;font-size:11px;letter-spacing:.16em;color:rgba(232,196,106,.6);height:14px;}

.shaking{animation:shake .42s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{
  10%,90%{transform:translateX(-3px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}
  40%,60%{transform:translateX(7px)}
}
.flashbad{animation:flashbad .4s;}
@keyframes flashbad{0%{box-shadow:inset 0 0 0 0 rgba(192,57,43,.7)}30%{box-shadow:inset 0 0 120px 30px rgba(192,57,43,.55)}100%{box-shadow:inset 0 0 0 0 rgba(192,57,43,0)}}

/* ---------- 新增：控制按钮 / 难度 / 暂停 / 成就 / 分享 ---------- */
.game{position:relative;}
.hud{position:relative;}
.hud-act{display:flex;flex-direction:column;gap:5px;flex:none;margin-left:6px;}
.hud-btn{
  width:36px;height:30px;border-radius:9px;border:1px solid rgba(232,196,106,.25);
  background:rgba(232,196,106,.06);color:var(--gold-2);font-size:15px;cursor:pointer;line-height:1;
  transition:background .2s,transform .07s;
}
.hud-btn:active{transform:scale(.93);}
.hud-btn:disabled{opacity:.32;cursor:default;}
.hud-btn.muted{color:#8a8a8a;background:rgba(120,120,120,.1);}

.difficulty{margin-top:22px;width:100%;max-width:330px;}
.difficulty-label{font-size:11px;letter-spacing:.52em;text-indent:.52em;color:rgba(232,196,106,.5);margin-bottom:11px;}
.diff-options{display:flex;gap:10px;justify-content:center;}
.diff-btn{
  flex:1;padding:12px 0;border-radius:12px;cursor:pointer;font-family:inherit;
  font-size:15px;font-weight:700;letter-spacing:.16em;
  color:rgba(242,230,207,.6);background:rgba(232,196,106,.05);
  border:1px solid rgba(232,196,106,.18);transition:all .18s;
}
.diff-btn:hover{border-color:rgba(232,196,106,.42);}
.diff-btn.sel{
  color:#211003;background:linear-gradient(180deg,#f7e3ac,#e8c46a);
  border-color:#f7e3ac;box-shadow:0 0 22px rgba(232,196,106,.4);
}
.diff-btn small{display:block;font-size:10px;font-weight:400;letter-spacing:.06em;margin-top:5px;opacity:.72;}
.diff-btn.sel small{opacity:.85;}

.pause-mark{font-size:58px;color:var(--gold-2);margin:14px 0 4px;text-shadow:0 0 30px rgba(232,196,106,.45);}
.btn-ghost{
  margin-top:14px;padding:12px 40px;border-radius:40px;border:1px solid rgba(232,196,106,.32);
  background:transparent;color:rgba(242,230,207,.62);font-family:inherit;font-size:15px;
  letter-spacing:.24em;text-indent:.24em;cursor:pointer;transition:all .18s;
}
.btn-ghost:hover{border-color:rgba(232,196,106,.6);color:var(--gold-2);}

.achv-block{margin-top:22px;width:min(100%,330px);}
.achv-title{font-size:11px;letter-spacing:.4em;text-indent:.4em;color:rgba(232,196,106,.5);margin-bottom:10px;}
.achv-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.achv-chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;
  font-size:12px;letter-spacing:.04em;border:1px solid rgba(232,196,106,.3);
  background:rgba(232,196,106,.08);color:var(--gold-2);
}
.achv-chip small{color:rgba(242,230,207,.5);font-size:10px;letter-spacing:.05em;}
.achv-chip.locked{opacity:.42;filter:grayscale(.85);border-color:rgba(242,230,207,.14);color:rgba(242,230,207,.48);}
.achv-sum{font-size:11px;letter-spacing:.18em;color:rgba(232,196,106,.5);}
.achv-toast-wrap{
  position:fixed;left:0;right:0;bottom:26px;z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
}
.achv-toast{
  padding:9px 18px;border-radius:20px;font-size:13px;letter-spacing:.06em;color:#211003;
  background:linear-gradient(180deg,#f7e3ac,#e8c46a);
  box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 20px rgba(232,196,106,.5);
  opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;
}
.achv-toast.go{opacity:1;transform:translateY(0);}

.btn-share{
  margin-top:14px;padding:13px 44px;border-radius:40px;cursor:pointer;font-family:inherit;
  font-size:15px;font-weight:700;letter-spacing:.22em;text-indent:.22em;
  border:1px solid rgba(232,196,106,.5);color:var(--gold-2);background:rgba(192,57,43,.25);
  transition:transform .1s,box-shadow .22s,background .22s;
}
.btn-share:active{transform:scale(.96);}
.btn-share.done{background:rgba(46,120,74,.4);border-color:#6fce93;color:#d9ffea;}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="game" id="game">
  <div class="hud">
    <div class="hud-item"><span class="hud-label">分数</span><b id="score">0</b></div>
    <div class="hud-item"><span class="hud-label">连击</span><b id="combo">0</b></div>
    <div class="hud-item"><span class="hud-label">命数</span><b id="lives"></b></div>
    <div class="hud-act">
      <button class="hud-btn" id="btnSound" type="button" aria-label="声音开关" title="声音开关">🔊</button>
      <button class="hud-btn" id="btnPause" type="button" aria-label="暂停" title="暂停(P)" disabled>⏸</button>
    </div>
  </div>

  <div class="cmd">
    <div class="cmd-label">戏 令</div>
    <div class="cmd-main" id="cmdMain">
      <span class="cmd-dot" id="cmdDot"></span>
      <span id="cmdText">—</span>
    </div>
  </div>

  <div class="stage-face">
    <div class="ring"></div>
    <div class="face" id="face"></div>
  </div>

  <button class="btn-liang" id="liang" type="button" disabled>
    亮 相
    <small>空格 / 点击</small>
  </button>
</div>

<div class="overlay show" id="startPanel">
  <h1 class="title">变脸大师</h1>
  <div class="subtitle">川 剧 绝 活 · 眼 疾 手 快</div>
  <div class="divider"></div>
  <div class="rules">
    <p><span>壹</span>脸谱每变一张，颜色皆不同。</p>
    <p><span>贰</span>看清上方<em>戏令</em>所指的颜色。</p>
    <p><span>叁</span>目标出现的瞬间，按<em>亮相</em>定格。</p>
    <p><span>肆</span>变错一张，折损一条命，共<span id="rulesLives">五</span>命。</p>
  </div>
  <div class="difficulty">
    <div class="difficulty-label">择 一 难 度</div>
    <div class="diff-options" id="diffOptions">
      <button class="diff-btn" data-diff="easy" type="button">学徒<small>入梨园 · 稳扎稳打</small></button>
      <button class="diff-btn sel" data-diff="normal" type="button">台柱<small>挑大梁 · 眼疾手快</small></button>
      <button class="diff-btn" data-diff="hard" type="button">宗师<small>镇全场 · 电光石火</small></button>
    </div>
  </div>
  <button class="btn-start" id="btnStart">开 戏</button>
  <div class="achv-sum" id="achvSummary" style="margin-top:18px"></div>
  <div class="hint">建议开启声音 · 支持触屏 · 空格亮相</div>
</div>

<div class="overlay" id="endPanel">
  <div class="subtitle">— 落 幕 —</div>
  <div class="rank" id="rankName">初入梨园</div>
  <div class="rank-poem" id="rankPoem"></div>
  <div class="score-big" id="finalScore">0</div>
  <div class="stats">
    <div class="stat"><span>最高连击</span><b id="finalCombo">0</b></div>
    <div class="stat"><span>准确率</span><b id="finalAcc">0%</b></div>
    <div class="stat"><span>命中</span><b id="finalHits">0</b></div>
  </div>
  <div class="best-tip" id="bestTip"></div>
  <div class="achv-block" id="newAchvBlock" style="display:none">
    <div class="achv-title">本 场 新 达 成</div>
    <div class="achv-list" id="newAchvList"></div>
  </div>
  <div class="achv-block">
    <div class="achv-title">已 集 成 就</div>
    <div class="achv-list" id="allAchvList"></div>
    <div class="achv-sum" id="achvSum"></div>
  </div>
  <button class="btn-share" id="btnShare" type="button">📤 分 享 战 绩</button>
  <button class="btn-start" id="btnAgain">再 来 一 出</button>
</div>

<div class="overlay" id="pausePanel">
  <div class="subtitle">— 稍 歇 —</div>
  <div class="pause-mark">⏸</div>
  <div class="hint">眼观六路，心不慌</div>
  <button class="btn-start" id="btnResume">继 续</button>
  <button class="btn-ghost" id="btnRestart">重 来 一 出</button>
  <div class="hint">按 P 键继续</div>
</div>

<div class="achv-toast-wrap" id="achvToastWrap"></div>

<script>
(function(){
'use strict';

/* ==================== 脸谱配置 ==================== */
const FACES = [
  { key:'hong', name:'红', role:'忠勇 · 关羽',
    bg:'#b52a25', deep:'#6b1512', ink:'#1a0605', line:'#f0d089', crownC:'#f0d089',
    crown:'flame',   brow:'M48 74 C64 60 86 62 98 76', light:'#ff7166' },
  { key:'hei', name:'黑', role:'刚直 · 张飞',
    bg:'#3a332e', deep:'#141110', ink:'#e9dfc8', line:'#d9b45e', crownC:'#d9b45e',
    crown:'thunder', brow:'M46 62 C64 56 86 58 98 74', light:'#bcb2a0' },
  { key:'bai', name:'白', role:'机谋 · 曹操',
    bg:'#e6ddc8', deep:'#b9ab8c', ink:'#1a1512', line:'#8a6b2f', crownC:'#1a1512',
    crown:'cloud',   brow:'M50 74 C66 64 86 64 98 76', light:'#f6efdd' },
  { key:'qing', name:'青', role:'妖异 · 鬼面',
    bg:'#1f6b6b', deep:'#0b3535', ink:'#061a1a', line:'#8fe0d2', crownC:'#8fe0d2',
    crown:'spiral',  brow:'M46 70 C64 54 86 60 98 80', light:'#5fe0cf' },
  { key:'jin', name:'金', role:'神佛 · 护法',
    bg:'#d9a72c', deep:'#8f691a', ink:'#3a2405', line:'#fff3c4', crownC:'#3a2405',
    crown:'sun',     brow:'M48 66 C64 52 86 55 98 70', light:'#ffd257' },
  { key:'zi', name:'紫', role:'刚正 · 侠士',
    bg:'#6b3a86', deep:'#3a1f52', ink:'#efe0ff', line:'#e0bdf5', crownC:'#e0bdf5',
    crown:'lotus',   brow:'M50 70 C66 58 86 60 98 74', light:'#c79bf0' }
];

/* 额头纹样（只画左半，右侧镜像） */
const CROWN = {
  flame: c => `

/* ==================== Canvas 粒子 ==================== */
const fxCanvas = $('#fx');
const fxc = fxCanvas.getContext('2d');
let W = 0, H = 0, parts = [], dust = [];

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  fxCanvas.width = Math.floor(W * dpr);
  fxCanvas.height = Math.floor(H * dpr);
  fxCanvas.style.width = W + 'px';
  fxCanvas.style.height = H + 'px';
  fxc.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (dust.length === 0) initDust();
}
function initDust(){
  dust = [];
  for (let i = 0; i < 46; i++){
    dust.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.6 + Math.random() * 1.7,
      vy: -0.06 - Math.random() * 0.26,
      vx: (Math.random() - 0.5) * 0.16,
      a: 0.06 + Math.random() * 0.3,
      ph: Math.random() * 6.28
    });
  }
}
function burst(x, y, colors, count, spd){
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const v = spd * (0.3 + Math.random() * 1.05);
    parts.push({
      x: x, y: y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 1.2,
      life: 1,
      decay: 0.011 + Math.random() * 0.019,
      size: 1.4 + Math.random() * 3.4,
      color: colors[(Math.random() * colors.length) | 0]
    });
  }
}
function burstFrom(el, colors, count, spd){
  const r = el.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, colors, count, spd);
}
function loop(t){
  fxc.clearRect(0, 0, W, H);
  for (let i = 0; i < dust.length; i++){
    const d = dust[i];
    d.y += d.vy;
    d.x += d.vx + Math.sin(t / 2400 + d.ph) * 0.1;
    if (d.y < -12){ d.y = H + 12; d.x = Math.random() * W; }
    fxc.beginPath();
    fxc.arc(d.x, d.y, d.r, 0, 6.2832);
    fxc.fillStyle = 'rgba(232,196,106,' + d.a + ')';
    fxc.fill();
  }
  for (let j = parts.length - 1; j >= 0; j--){
    const p = parts[j];
    p.vy += 0.15; p.vx *= 0.986; p.vy *= 0.986;
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0){ parts.splice(j, 1); continue; }
    fxc.globalAlpha = Math.max(0, p.life);
    fxc.beginPath();
    fxc.arc(p.x, p.y, Math.max(0.2, p.size * p.life), 0, 6.2832);
    fxc.fillStyle = p.color;
    fxc.fill();
  }
  fxc.globalAlpha = 1;
  requestAnimationFrame(loop);
}

/* ==================== 音效（Web Audio 实时合成） ==================== */
let AC = null, masterGain = null, noiseBuf = null, SND_ON = true;
function acInit(){
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    masterGain = AC.createGain();
    masterGain.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  if (masterGain) masterGain.gain.value = SND_ON ? 1 : 0;
}
function getNoise(){
  if (noiseBuf) return noiseBuf;
  const len = Math.floor(AC.sampleRate * 0.6);
  const b = AC.createBuffer(1, len, AC.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  noiseBuf = b;
  return b;
}
function sfxSwish(){
  if (!AC || !SND_ON) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = getNoise();
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(2200, t);
  bp.frequency.exponentialRampToValueAtTime(520, t + 0.16);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.1, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.19);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.22);
}
function sfxGong(){
  if (!AC || !SND_ON) return;
  const t = AC.currentTime;
  const freqs = [196, 294, 411, 548, 733];
  for (let i = 0; i < freqs.length; i++){
    const f = freqs[i];
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.93, t + 1.1);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.16 / (i * 0.75 + 1), t);
    g.gain.exponentialRampToValueAtTime(0.0006, t + 1.25);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 1.35);
  }
}
function sfxThud(){
  if (!AC || !SND_ON) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(44, t + 0.32);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.34, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + 0.46);
}

/* ==================== 游戏状态 ==================== */
const DIFFS = {
  easy:   { name:'学徒', base:1000, min:480, accel:0.955, lives:7, livesCn:'七' },
  normal: { name:'台柱', base:840,  min:370, accel:0.93,  lives:5, livesCn:'五' },

};
let SEL_DIFF = 'normal';
let ACHV_UNLOCK = [];
let SESSION_ACHV = [];
const G = {
  running:false, paused:false, score:0, combo:0, best:0,
  lives:DIFFS.normal.lives, totalLives:DIFFS.normal.lives,
  hits:0, shots:0, face:0, cmd:0, lastCmd:-1,
  speed:DIFFS.normal.base, minSpeed:DIFFS.normal.min, accel:DIFFS.normal.accel,

function renderFace(i, animate){
  faceEl.innerHTML = faceSVG(i);
  if (animate){
    faceEl.classList.remove('pop');
    void faceEl.offsetWidth;
    faceEl.classList.add('pop');
  }
}
function renderCmd(){
  const f = FACES[G.cmd];
  cmdText.textContent = f.name + '脸';
  cmdText.style.color = f.light;
  cmdDot.style.color = f.bg;
  cmdMain.classList.remove('pop');
  void cmdMain.offsetWidth;
  cmdMain.classList.add('pop');
}
function renderLives(){
  let html = '';
  for (let i = 0; i < G.totalLives; i++) html += '<i class="' + (i < G.lives ? 'on' : '') + '">◆</i>';
  elLives.innerHTML = html;
}
function bump(el){
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}
function updateHUD(){
  elScore.textContent = G.score;
  elCombo.textContent = G.combo;
  renderLives();
}
function floatText(text, x, y, color){
  const d = document.createElement('div');
  d.className = 'float';
  d.textContent = text;
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  if (color) d.style.color = color;
  document.body.appendChild(d);
  void d.offsetWidth;
  d.classList.add('go');
  setTimeout(() => d.remove(), 950);
}

function newCommand(){
  let n;
  let guard = 0;
  do {
    n = Math.floor(Math.random() * FACES.length);
    guard++;
  } while ((n === G.face || n === G.lastCmd) && guard < 40);
  G.cmd = n;
  G.lastCmd = n;
  renderCmd();
}

function tick(){
  if (!G.running) return;
  G.face = (G.face + 1) % FACES.length;
  renderFace(G.face, true);
  sfxSwish();
  G.timer = setTimeout(tick, G.speed * (0.86 + Math.random() * 0.28));
}

function hitFace(){
  G.shots++; G.hits++;
  G.combo++;
  if (G.combo > G.best) G.best = G.combo;
  const gain = 100 + (G.combo - 1) * 25;
  G.score += gain;

  sfxGong();
  faceEl.classList.remove('hit');
  void faceEl.offsetWidth;
  faceEl.classList.add('hit');
  burstFrom(faceEl, ['#f7e3ac', '#e8c46a', '#fff6dd', '#d99b3a'], 30, 7);

  const r = faceEl.getBoundingClientRect();
  floatText('+' + gain, r.left + r.width / 2, r.top + r.height * 0.22);

  if (G.combo > 1) bump(elCombo);
  bump(elScore);
  G.speed = Math.max(G.minSpeed, G.speed * G.accel);
  updateHUD();
  checkAndUnlock();
  newCommand();

  clearTimeout(G.timer);
  G.timer = setTimeout(tick, G.speed * 1.35);
}

function missFace(){
  G.shots++;
  G.combo = 0;
  G.lives--;
  sfxThud();

  gameEl.classList.remove('shaking');
  void gameEl.offsetWidth;
  gameEl.classList.add('shaking');
  gameEl.classList.remove('flashbad');
  void gameEl.offsetWidth;
  gameEl.classList.add('flashbad');
  G.flawless = false;

  const mr = faceEl.getBoundingClientRect();
  floatText('变错 · 扣一命', mr.left + mr.width / 2, mr.top + mr.height * 0.32, '#ff7a6b');

  updateHUD();
  G.lockUntil = performance.now() + 260;

  if (G.lives <= 0){
    setTimeout(gameOver, 480);
    G.running = false;
    clearTimeout(G.timer);
    return;
  }
  clearTimeout(G.timer);
  G.timer = setTimeout(tick, G.speed * 1.55);
}

function lianxiang(){
  if (!G.running || G.paused) return;
  const now = performance.now();
  if (now < G.lockUntil) return;
  if (G.face === G.cmd) hitFace();
  else missFace();
}

/* ==================== 开始 / 结束 ==================== */
function startGame(){
  acInit();
  const diff = DIFFS[SEL_DIFF] || DIFFS.normal;
  G.running = true; G.paused = false;
  G.score = 0; G.combo = 0; G.best = 0; G.hits = 0; G.shots = 0;
  G.lives = diff.lives; G.totalLives = diff.lives;
  G.speed = diff.base; G.minSpeed = diff.min; G.accel = diff.accel;
  G.flawless = true;
  G.face = Math.floor(Math.random() * FACES.length);
  G.lastCmd = -1;
  G.lockUntil = performance.now() + 300;
  SESSION_ACHV = ACHV_UNLOCK.slice();

  updateHUD();
  elScore.textContent = '0';
  elCombo.textContent = '0';
  renderFace(G.face, true);
  newCommand();

  $('#liang').disabled = false;
  $('#btnPause').disabled = false;
  $('#startPanel').classList.remove('show');
  $('#endPanel').classList.remove('show');
  $('#pausePanel').classList.remove('show');

  clearTimeout(G.timer);
  G.timer = setTimeout(tick, 1100);
}

const RANKS = [
  { min:3600, name:'变脸宗师', poem:'一甩头，千般面目；一抬手，万种风情。' },
  { min:2400, name:'川剧名角', poem:'台上一分钟，台下十年功。' },
  { min:1400, name:'跟斗小生', poem:'身段已稳，可上台面。' },
  { min:600,  name:'梨园学徒', poem:'眼要快，手要稳，再来一遍。' },
  { min:0,    name:'初入梨园', poem:'别急，先看清那张脸。' }
];

function gameOver(){
  G.running = false;
  clearTimeout(G.timer);
  $('#liang').disabled = true;

  const acc = G.shots ? Math.round(G.hits / G.shots * 100) : 0;
  let rank = RANKS[RANKS.length - 1];
  for (let i = 0; i < RANKS.length; i++){
    if (G.score >= RANKS[i].min){ rank = RANKS[i]; break; }
  }

  $('#rankName').textContent = rank.name;
  $('#rankPoem').textContent = rank.poem;
  $('#finalScore').textContent = G.score;
  $('#finalCombo').textContent = G.best;
  $('#finalAcc').textContent = acc + '%';
  $('#finalHits').textContent = G.hits;

  checkAndUnlock();
  renderEndAchv();

  let bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem('bianlian_best') || '0', 10) || 0; } catch(e){}
  const tip = $('#bestTip');
  if (G.score > bestScore){
    try { localStorage.setItem('bianlian_best', String(G.score)); } catch(e){}
    tip.textContent = '★ 新纪录 · 破了旧日头面';
    tip.style.color = 'var(--gold-2)';
  } else {
    tip.textContent = '最高分 ' + bestScore;
    tip.style.color = 'rgba(232,196,106,.5)';
  }

  $('#endPanel').classList.add('show');
}

function saveAchv(){
  try { localStorage.setItem('bianlian_achv', JSON.stringify(ACHV_UNLOCK)); } catch(e){}
}
function showAchvToast(a){
  const wrap = $('#achvToastWrap');
  const d = document.createElement('div');
  d.className = 'achv-toast';
  d.textContent = a.icon + ' 达成成就 · ' + a.name + '(' + a.desc + ')';
  wrap.appendChild(d);
  void d.offsetWidth;
  d.classList.add('go');
  setTimeout(function(){ d.classList.remove('go'); setTimeout(function(){ d.remove(); }, 340); }, 2400);
}
function checkAndUnlock(){
  let changed = false;
  ACHV.forEach(function(a){
    let ok = false;
    try { ok = a.test(); } catch(e){}
    if (ok && ACHV_UNLOCK.indexOf(a.id) === -1){
      ACHV_UNLOCK.push(a.id); saveAchv(); changed = true;
      showAchvToast(a);
    }
  });
  return changed;
}
function renderAchvSummary(){
  const el = document.getElementById('achvSummary');
  if (el) el.textContent = '已集成就 ' + ACHV_UNLOCK.length + ' / ' + ACHV.length;
}
function renderEndAchv(){
  const all = document.getElementById('allAchvList');
  const nd = document.getElementById('newAchvList');
  const sum = document.getElementById('achvSum');
  const block = document.getElementById('newAchvBlock');
  if (!all) return;
  all.innerHTML = ''; nd.innerHTML = '';
  const newly = [];
  ACHV.forEach(function(a){
    const unlocked = ACHV_UNLOCK.indexOf(a.id) > -1;
    const chip = document.createElement('span');
    chip.className = 'achv-chip' + (unlocked ? '' : ' locked');
    chip.innerHTML = '<span>' + a.icon + ' ' + a.name + '</span><small>' + (unlocked ? '已达成' : '未达成') + '</small>';
    all.appendChild(chip);
    if (unlocked && SESSION_ACHV.indexOf(a.id) === -1) newly.push(a.icon + ' ' + a.name);
  });
  if (newly.length){
    block.style.display = '';
    newly.forEach(function(t){
      const c = document.createElement('span');
      c.className = 'achv-chip';
      c.textContent = '🎉 ' + t;
      nd.appendChild(c);
    });
  } else {
    block.style.display = 'none';
  }
  if (sum) sum.textContent = '已集成就 ' + ACHV_UNLOCK.length + ' / ' + ACHV.length;
}

    if (!btn) return;
    btn.classList.add('done');
    btn.textContent = '✓ 已 复 制';
    setTimeout(function(){ btn.classList.remove('done'); btn.textContent = '📤 分 享 战 绩'; }, 2200);
  };
  const fallback = function(){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok)['catch'](function(){ fallback(); ok(); });
  } else { fallback(); ok(); }
}

/* ==================== 输入 ==================== */
$('#liang').addEventListener('pointerdown', function(e){
  e.preventDefault();
  lianxiang();
});
document.addEventListener('keydown', function(e){
  const k = e.key || '';
  if (k === 'p' || k === 'P'){
    if (G.paused) resumeGame();
    else if (G.running && !$('#pausePanel').classList.contains('show')) pauseGame();
    return;
  }
  if (e.code === 'Space' || k === ' ' || k === 'Enter'){
    e.preventDefault();
    if (G.paused){ resumeGame(); return; }
    if (G.running) lianxiang();
    else if ($('#startPanel').classList.contains('show')) startGame();
    else if ($('#endPanel').classList.contains('show')) startGame();
  }
});
$('#btnStart').addEventListener('click', startGame);
$('#btnAgain').addEventListener('click', startGame);

/* 控制按钮 */
function setSoundIcon(){
  const b = $('#btnSound');
  if (!b) return;
  b.textContent = SND_ON ? '🔊' : '🔇';
  b.classList.toggle('muted', !SND_ON);
}
$('#btnSound').addEventListener('click', function(){
  SND_ON = !SND_ON;
  try { localStorage.setItem('bianlian_snd', SND_ON ? '1' : '0'); } catch(e){}
  if (masterGain) masterGain.gain.value = SND_ON ? 1 : 0;
  setSoundIcon();
});
$('#btnPause').addEventListener('click', function(){
  if (G.paused) resumeGame(); else pauseGame();
});
$('#btnResume').addEventListener('click', resumeGame);
$('#btnRestart').addEventListener('click', function(){
  $('#pausePanel').classList.remove('show');
  startGame();
});
$('#btnShare').addEventListener('click', shareResult);
document.getElementById('diffOptions').addEventListener('click', function(e){
  const b = e.target.closest('.diff-btn');
  if (b) selectDiff(b.dataset.diff);
});

/* ==================== 启动 ==================== */
window.addEventListener('resize', resize);
resize();
renderLives();
renderFace(0, false);
requestAnimationFrame(loop);

/* 读取存档设置 */
try {
  const sd = localStorage.getItem('bianlian_diff');
  if (sd && DIFFS[sd]) SEL_DIFF = sd;
  const sn = localStorage.getItem('bianlian_snd');
  if (sn !== null) SND_ON = sn === '1';
  const av = localStorage.getItem('bianlian_achv');
  if (av){ const arr = JSON.parse(av); if (Array.isArray(arr)) ACHV_UNLOCK = arr; }
} catch(e){}
ACHV_UNLOCK = ACHV_UNLOCK.filter(function(id){ return ACHV.some(function(a){ return a.id === id; }); });
document.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.toggle('sel', b.dataset.diff === SEL_DIFF); });
const rl = document.getElementById('rulesLives');
if (rl) rl.textContent = DIFFS[SEL_DIFF].livesCn;
setSoundIcon();
renderAchvSummary();
})();
</script>
</body>
